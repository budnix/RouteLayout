<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>RouteLayout – H0 track planner (PIKO A-Gleis)</title>
  <meta name="description" content="H0 model railway track planner for PIKO A-Gleis with 3D preview. Works on iPad and iPhone.">
  <meta name="theme-color" content="#1d2b3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RouteLayout">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M3 18c4-10 14-10 18 0"/><path d="M3 14c4-10 14-10 18 0"/><path d="M6 14.5l.6 2.6M10 12.2l.4 2.8M14 12.2l-.4 2.8M18 14.5l-.6 2.6"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
    <symbol id="i-rotate-ccw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-rotate-cw" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
    <symbol id="i-train" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="12" rx="3"/><path d="M4 10h16M8 20l-2 2M16 20l2 2M9 16v4M15 16v4"/><circle cx="9" cy="13" r="0.8"/><circle cx="15" cy="13" r="0.8"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 9h13l-3-3M20 15H7l3 3"/></symbol>
    <symbol id="i-select" viewBox="0 0 24 24"><path d="M4 4h4M10 4h4M16 4h4M4 10v4M4 16v4M20 10v4M20 16v4M4 20h4M10 20h4M16 20h4" stroke-dasharray="none"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 16l9 5 9-5"/></symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3 17l14-14 4 4L7 21z"/><path d="M8 8l2 2M11 5l2 2M14 11l2 2M5 11l2 2"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4M12 2v13"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M20 20H8.5L3.6 15.1a2 2 0 0 1 0-2.8l8.5-8.5a2 2 0 0 1 2.8 0l5.7 5.7a2 2 0 0 1 0 2.8L14 19"/><path d="M6.5 12.5l6 6"/></symbol>
  </svg>
  <header class="topbar">
    <div class="brand"><svg class="ic logo"><use href="#i-logo"/></svg> RouteLayout <span class="sub">H0 · PIKO A</span></div>
    <div class="topbar-actions">
      <button id="btn-new" class="icon" data-i18n-title="top.new"><svg class="ic"><use href="#i-eraser"/></svg></button>
      <button id="btn-undo" class="icon" data-i18n-title="top.undo"><svg class="ic"><use href="#i-undo"/></svg></button>
      <button id="btn-redo" class="icon" data-i18n-title="top.redo"><svg class="ic"><use href="#i-redo"/></svg></button>
      <div class="seg" role="tablist">
        <button id="tab-2d" class="active" role="tab">2D</button>
        <button id="tab-3d" role="tab">3D</button>
        <button id="tab-split" role="tab" class="wide-only">2D + 3D</button>
      </div>
      <button id="btn-menu" class="icon" data-i18n-title="top.menu"><svg class="ic"><use href="#i-menu"/></svg><span id="menu-badge" class="menu-badge hidden"></span></button>
    </div>
  </header>

  <main class="workspace mode-2d">
    <section id="pane-2d" class="pane">
      <canvas id="canvas2d"></canvas>
      <div class="hud">
        <button id="btn-fit2d" class="hud-btn" data-i18n-title="hud.fit"><svg class="ic"><use href="#i-fit"/></svg></button>
        <button id="btn-zoom-in" class="hud-btn"><svg class="ic"><use href="#i-plus"/></svg></button>
        <button id="btn-zoom-out" class="hud-btn"><svg class="ic"><use href="#i-minus"/></svg></button>
        <button id="btn-draw" class="hud-btn" data-i18n-title="draw.toggle"><svg class="ic"><use href="#i-pencil"/></svg></button>
        <button id="btn-close" class="hud-btn hidden" data-i18n-title="close.btn"><svg class="ic"><use href="#i-link"/></svg></button>
        <button id="btn-train" class="hud-btn" data-i18n-title="train.toggle"><svg class="ic"><use href="#i-train"/></svg></button>
        <button id="btn-marquee" class="hud-btn" data-i18n-title="sel.marquee"><svg class="ic"><use href="#i-select"/></svg></button>
        <button id="btn-dims" class="hud-btn" data-i18n-title="dims.toggle"><svg class="ic"><use href="#i-ruler"/></svg></button>
        <button id="btn-levels" class="hud-btn" data-i18n-title="levels.toggle"><svg class="ic"><use href="#i-layers"/></svg><span id="levels-count" class="badge-mini"></span></button>
      </div>
      <div id="levels-bar" class="draw-bar hidden">
        <button id="btn-level-down" data-i18n-title="levels.down"><svg class="ic"><use href="#i-minus"/></svg></button>
        <select id="sel-level"></select>
        <button id="btn-level-up" data-i18n-title="levels.up"><svg class="ic"><use href="#i-plus"/></svg></button>
        <span class="hint" data-i18n="levels.hint"></span>
      </div>
      <div id="train-bar" class="draw-bar hidden">
        <button id="btn-play" class="primary" data-i18n-title="train.play"><svg class="ic"><use href="#i-play"/></svg></button>
        <button id="btn-reverse" data-i18n-title="train.reverse"><svg class="ic"><use href="#i-swap"/></svg></button>
        <label class="chk speed"><input id="in-speed" type="range" min="20" max="600" step="10" value="150"> <span id="speed-label"></span></label>
        <span class="hint" data-i18n="train.hint"></span>
      </div>
      <div id="draw-bar" class="draw-bar hidden">
        <label class="chk"><input id="chk-grid" type="checkbox"> <span data-i18n="draw.grid"></span></label>
        <label class="chk" data-i18n-title="draw.fixTitle"><input id="chk-fix" type="checkbox" checked> <span data-i18n="draw.fix"></span></label>
        <button id="btn-undo-stroke" data-i18n-title="draw.undoStroke"><svg class="ic"><use href="#i-undo"/></svg></button>
        <button id="btn-clear-sketch" data-i18n="draw.clear"></button>
        <button id="btn-finish" class="primary" data-i18n="draw.finish"></button>
      </div>
      <div id="sel-tools" class="sel-tools hidden">
        <span id="sel-name" class="sel-name"></span>
        <label class="size" id="sel-z"><span data-i18n="sel.z"></span><input id="in-sel-z" type="number" step="5" title="mm"></label>
        <label class="size" id="sel-grade"><span data-i18n="sel.grade"></span><input id="in-sel-g" type="number" step="0.5" min="-8" max="8" title="%"></label>
        <label class="size" id="sel-size-w"><span data-i18n="sel.w"></span><input id="in-sel-w" type="number" min="10" step="10"></label>
        <label class="size" id="sel-size-h"><span data-i18n="sel.h"></span><input id="in-sel-h" type="number" min="10" step="10"></label>
        <button id="btn-rot-l" data-i18n-title="sel.rotl"><svg class="ic"><use href="#i-rotate-ccw"/></svg></button>
        <button id="btn-rot-r" data-i18n-title="sel.rotr"><svg class="ic"><use href="#i-rotate-cw"/></svg></button>
        <button id="btn-del" class="danger" data-i18n-title="sel.del"><svg class="ic"><use href="#i-trash"/></svg></button>
      </div>
    </section>
    <section id="pane-3d" class="pane">
      <div id="view3d"></div>
      <div class="hud">
        <button id="btn-fit3d" class="hud-btn" data-i18n-title="hud.fit3d"><svg class="ic"><use href="#i-fit"/></svg></button>
      </div>
    </section>
  </main>

  <button id="btn-side" class="side-toggle wide-only" data-i18n-title="side.toggle"><svg class="ic"><use href="#i-chevron-right"/></svg></button>
  <aside class="palette" id="palette">
    <div class="palette-grip" id="palette-grip"><span></span></div>
    <div class="palette-body">
      <div class="seg tabs" id="pal-tabs" role="tablist">
        <button data-tab="piko" class="active" role="tab" data-i18n="tab.piko"></button>
        <button data-tab="accessory" role="tab" data-i18n="tab.accessory"></button>
        <button data-tab="scenery" role="tab" data-i18n="tab.scenery"></button>
      </div>
      <div class="row compact" id="system-row">
        <label class="field grow"><span data-i18n="pal.system"></span><select id="sel-system"></select></label>
      </div>
      <div class="row compact" id="entry-row">
        <label class="field grow"><span data-i18n="pal.entry"></span><select id="sel-entry"></select></label>
      </div>
      <div id="pal-list" class="pal-list" role="list"></div>
      <p class="hint" id="hint" data-i18n="pal.hint"></p>
    </div>
  </aside>

  <div id="menu" class="sheet hidden">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel">
      <h2 data-i18n="menu.layout"></h2>
      <div class="row">
        <label class="field grow"><span data-i18n="menu.name"></span><input id="in-name" type="text"></label>
        <label class="field"><span data-i18n="menu.lang"></span><select id="sel-lang"></select></label>
        <label class="field" data-i18n-title="menu.stockHint"><span data-i18n="menu.stock"></span><select id="sel-stock"></select></label>
      </div>
      <div class="row">
        <label class="field"><span data-i18n="menu.boardW"></span><input id="in-w" type="number" min="200" step="10"></label>
        <label class="field"><span data-i18n="menu.boardH"></span><input id="in-h" type="number" min="200" step="10"></label>
        <button id="btn-board" class="grow" data-i18n="menu.apply"></button>
      </div>
      <div class="row">
        <label class="field"><span data-i18n="menu.boardColor"></span><input id="in-board-color" type="color" value="#5f8f4a"></label>
        <div class="swatches" id="swatches">
          <button type="button" data-color="#5f8f4a" style="background:#5f8f4a" data-i18n-title="color.grass"></button>
          <button type="button" data-color="#c9a76b" style="background:#c9a76b" data-i18n-title="color.plywood"></button>
          <button type="button" data-color="#8a8f95" style="background:#8a8f95" data-i18n-title="color.grey"></button>
          <button type="button" data-color="#e9e6dd" style="background:#e9e6dd" data-i18n-title="color.white"></button>
          <button type="button" data-color="#6b5a45" style="background:#6b5a45" data-i18n-title="color.earth"></button>
        </div>
      </div>
      <div class="row">
        <label class="field"><span data-i18n="menu.gridSize"></span><input id="in-grid" type="number" min="5" max="500" step="5"></label>
        <label class="chk grow"><input id="chk-grid-menu" type="checkbox"> <span data-i18n="draw.grid"></span></label>
      </div>
      <div class="row wrap">
        <button id="btn-export" data-i18n="menu.export"></button>
        <button id="btn-import" data-i18n="menu.import"></button>
        <input id="file-import" type="file" accept="application/json,.json" hidden>
        <button id="btn-png" data-i18n="menu.png"></button>
        <button id="btn-share" data-i18n="menu.share"></button>
        <button id="btn-print-tiles" data-i18n="menu.printTiles"></button>
        <button id="btn-print-page" data-i18n="menu.printPage"></button>
        <button id="btn-clear" class="danger" data-i18n="menu.clear"></button>
      </div>
      <h2><span data-i18n="menu.problems"></span> <span id="problems-count" class="badge"></span></h2>
      <div id="problems" class="problems"></div>
      <h2 data-i18n="menu.bom"></h2>
      <div id="bom" class="bom"></div>
      <div class="row wrap"><button id="btn-copy-list" data-i18n="menu.copyList"></button><button id="btn-import-parts" data-i18n="menu.importParts" data-i18n-title="menu.importPartsHint"></button><span id="to-buy" class="hint"></span></div>
      <input id="file-import-parts" type="file" accept=".csv,.txt,.tsv,text/plain,text/csv" hidden>
      <p class="hint" data-i18n="menu.bomHint"></p>
      <button class="primary" data-close data-i18n="menu.close"></button>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="alert"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
