<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>RouteLayout – H0 track planner (PIKO A-Gleis)</title>
  <meta name="description" content="H0 model railway track planner for PIKO A-Gleis with 3D preview. Works on iPad and iPhone.">
  <meta name="theme-color" content="#1d2b3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RouteLayout">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">▣</span> RouteLayout <span class="sub">H0 · PIKO A</span></div>
    <div class="topbar-actions">
      <button id="btn-undo" class="icon" data-i18n-title="top.undo">↶</button>
      <button id="btn-redo" class="icon" data-i18n-title="top.redo">↷</button>
      <div class="seg" role="tablist">
        <button id="tab-2d" class="active" role="tab">2D</button>
        <button id="tab-3d" role="tab">3D</button>
        <button id="tab-split" role="tab" class="wide-only">2D + 3D</button>
      </div>
      <button id="btn-menu" class="icon" data-i18n-title="top.menu">☰</button>
    </div>
  </header>

  <main class="workspace mode-2d">
    <section id="pane-2d" class="pane">
      <canvas id="canvas2d"></canvas>
      <div class="hud">
        <button id="btn-fit2d" class="hud-btn" data-i18n-title="hud.fit">⤢</button>
        <button id="btn-zoom-in" class="hud-btn">+</button>
        <button id="btn-zoom-out" class="hud-btn">−</button>
      </div>
      <div id="sel-tools" class="sel-tools hidden">
        <span id="sel-name" class="sel-name"></span>
        <button id="btn-rot-l" data-i18n-title="sel.rotl">⟲</button>
        <button id="btn-rot-r" data-i18n-title="sel.rotr">⟳</button>
        <button id="btn-del" class="danger" data-i18n-title="sel.del">🗑</button>
      </div>
    </section>
    <section id="pane-3d" class="pane">
      <div id="view3d"></div>
      <div class="hud">
        <button id="btn-fit3d" class="hud-btn" data-i18n-title="hud.fit3d">⤢</button>
      </div>
    </section>
  </main>

  <aside class="palette" id="palette">
    <div class="palette-grip" id="palette-grip"><span></span></div>
    <div class="palette-body">
      <div class="row">
        <label class="field">
          <span data-i18n="pal.group"></span>
          <select id="sel-group"></select>
        </label>
        <label class="field grow">
          <span data-i18n="pal.piece"></span>
          <select id="sel-piece"></select>
        </label>
      </div>
      <div class="row">
        <label class="field">
          <span data-i18n="pal.entry"></span>
          <select id="sel-entry"></select>
        </label>
        <button id="btn-add" class="primary grow" data-i18n="pal.add"></button>
      </div>
      <div class="quick" id="quick"></div>
      <p class="hint" id="hint" data-i18n="pal.hint"></p>
    </div>
  </aside>

  <div id="menu" class="sheet hidden">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel">
      <h2 data-i18n="menu.layout"></h2>
      <div class="row">
        <label class="field grow"><span data-i18n="menu.name"></span><input id="in-name" type="text"></label>
        <label class="field"><span data-i18n="menu.lang"></span><select id="sel-lang"></select></label>
      </div>
      <div class="row">
        <label class="field"><span data-i18n="menu.boardW"></span><input id="in-w" type="number" min="200" step="10"></label>
        <label class="field"><span data-i18n="menu.boardH"></span><input id="in-h" type="number" min="200" step="10"></label>
        <button id="btn-board" class="grow" data-i18n="menu.apply"></button>
      </div>
      <div class="row wrap">
        <button id="btn-export" data-i18n="menu.export"></button>
        <button id="btn-import" data-i18n="menu.import"></button>
        <input id="file-import" type="file" accept="application/json,.json" hidden>
        <button id="btn-png" data-i18n="menu.png"></button>
        <button id="btn-clear" class="danger" data-i18n="menu.clear"></button>
      </div>
      <h2 data-i18n="menu.bom"></h2>
      <div id="bom" class="bom"></div>
      <p class="hint" data-i18n="menu.bomHint"></p>
      <button class="primary" data-close data-i18n="menu.close"></button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
