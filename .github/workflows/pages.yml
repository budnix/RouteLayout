name: Deploy to GitHub Pages

# Runs after the "Test" workflow finishes on main; deploys only if it was green.
on:
  workflow_run:
    workflows: [Test]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Safari i GitHub Pages (max-age=600) potrafią zmieszać stary moduł z nowym HTML;
      # doklejamy wersję do każdego importu, żeby każdy deploy unieważniał cache.
      - name: Cache-bust module URLs
        run: |
          V="${{ github.event.workflow_run.head_sha || github.sha }}"; V="${V:0:8}"
          sed -i -E "s#(src=\"js/main\.js|href=\"css/app\.css|\./vendor/three\.module\.js)\"#\1?v=$V\"#g" index.html
          find js vendor -name '*.js' -exec sed -i -E "s#(from ['\"]\.{1,2}/[^'\"]+\.js)(['\"])#\1?v=$V\2#g" {} +
          sed -i "s/__SW_VERSION__/$V/" sw.js
          grep -c "$V" index.html js/main.js vendor/three.module.js sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
